    Snippet: # Builded or Built Both builded and built are past participles of build.
    Dictionaries, even my beloved Oxford, dismiss the difference. They declare, Builded
    = Built; it’s simply a poetic, and now archaic, version of built. ... “For every
    house is **builded** by some _man_ ; but he that **built** all things _is_ God.”
    - Hebrews 3:4 Surely they knew what they were doing, and didn’t just randomly
    throw in an archaic or poetic participle. Why would they use one, and then, in
    a seemingly identical case, use the other? “…and there **builded** an altar unto
    the Lord….and there he **builded** an altar unto the LORD….” Genesis 12:7, 8 Poetic?
    Hmmmm, later, the same man, doing exactly the same activity: “…and Abraham **built**
    an altar there….” - Genesis 22:9 ... In Nehemiah, chapter 3, the Jews were repairing
    the wall. In 3:1, they builded. In 3:2, next to him builded. Then, and not randomly,
    in 3:3, “But the fish gate did the sons of Hassenaah build…” Ah, with the helping
    verb did, the base verb is used. Why? Why not builded? ... Moving ahead to Nehemiah
    chapter 3:14,15. “He built it, and set up the doors thereof, the locks thereof,
    and the bars thereof.” He gathered together a complete set of materials and hardware:
    **built** is used. This pattern is repeated in 3:15. Now, the opponents mocked
    the Jews as they began to repair the wall (4:1-3), word came to Sanballat that
    “we builded the wall.” (Far from '
