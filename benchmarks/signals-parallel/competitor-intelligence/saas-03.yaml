    +00:00 Commented Jan 12, 2011 at 9:17 ... ## 3 Answers 3 If you have a series
    of equations that you want to have mutual alignment, then you would use `align`
    . If the equations are part of a larger equation, then `aligned` is the right
    environment. I often will use `\begin{equation}\begin{aligned} ... \end{aligned}\end{equation}`
    to give a single equation number to a group, for example if I''m showing steps.
