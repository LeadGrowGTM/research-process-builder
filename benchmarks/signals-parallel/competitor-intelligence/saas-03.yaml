    Snippet: # aligned or align? programming llm Fine points of TeX alignment environments.
    Author Stephen J. Mildenhall Published 2025-10-23 Modified 2025-10-23 Beware:
    aligned environments in Quarto documents work differently in PDF (LaTeX) and HTML
    rendering. This post explains why. ## The Golden Rule: Avoid Nesting Display Math
    The core issue lies in LaTeX’s strictness: you cannot put one display math environment
    inside another (e.g., `align` inside `equation` or `$$...$$` ). Confusingly, you
    can with HTML Jax rendering. | Environment Type | Examples | Use Case | | **Display
    Math** | `\begin{equation}` , `\begin{align}` , `$$...$$` | These must be used
    as **standalone** blocks. | | **Inner Math** | `\begin{aligned}` , `\begin{gathered}`
    | These are designed to be **nested** inside another math environment. | ### Correct
    Usage for Aligned Equations | Goal | Environment | Numbered? | Correct Syntax
    | | **Alignment Inside `equation`** | `\begin{aligned}` | No (but outer `equation`
    is numbered) | Use inside `\begin{equation} ... \end{equation}` . | **Key Takeaway:**
    For unnumbered aligned equations, use `\begin{align*} ... \end{align*}` directly.
    This is the universally correct syntax that works for both HTML (using MathJax/KaTeX)
    and PDF (using LaTeX). ### Stars The asterisk versions, like `\begin{align*} ...
    \end{align*}` , are the correct way to produce **unnumbered** aligned equations'
