    Member Only Home / 4As Blog / AbelsonTaylor Group Established as Parent Company
    of AbelsonTaylor, AT Nutrient, Dose, and AT Activate Published 07.24.2023 Topic
    Technology CHICAGO, July 19, 2023 – Reflecting its successful expansion into new
    areas of healthcare marketing, leading health and wellness advertising agency
    AbelsonTaylor today announced the formation of AbelsonTaylor Group, which will
    serve as the parent company of the organization’s diverse healthcare businesses.
    The group consists of four business units: flagship agency AbelsonTaylor, one
    of the industry’s most revered and award-winning independent healthcare advertising
    agencies; AT Nutrient, an agency for challenger brands and category competitors
    with existing AbelsonTaylor clients; Dose, a full-service state-of-the-art production
    studio; and AT Activate, a self-managed media implementation group that purchases
    and optimizes paid media across all channels and platforms. “We are seeing tremendous
    change in the healthcare industry, with the development of innovative new products,
    new techniques for engaging with physicians and patients, and increasingly sophisticated
    data capabilities,” said Jeff Berg, who will serve as president of AbelsonTaylor
    Group. “Establishing AbelsonTaylor Group enables us to fully leverage our strategic,
    creative and technical skills and take on a broader range of clients and assignments,”
    he said, noting that the shared nucleus of all companies in the group is delivering
    Return on Imagination (ROI), equaling measurable business success for every client.
