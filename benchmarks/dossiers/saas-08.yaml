    Ralwel / Getty Images AIOps startup BigPanda raises Series E extension, bringing
    its total capital to $340M Kyle Wiggers 4:00 AM PDT · August 17, 2022 BigPanda
    , a startup developing AI to audit changes in IT environments and recommend how
    to fix them, has raised $20 million in an extension of its Series E round. UBS
    Next and Wells Fargo Strategic Capital contributed to the tranche, bringing BigPanda’s
    total raised to $340 million. The company’s valuation remains unchanged at $1.2
    billion. As my colleague Christine Hall recently reported, BigPanda works to prevent
    corporate network outages by analyzing data from observability and monitoring
    services. The platform can automate aspects of incident response, like ticketing,
    and optionally connect to third-party runbook automation tools to run automated
    workflows. BigPanda also provides analytics to track incident trends and metrics
    and to enable teams to measure progress toward company goals. BigPanda was founded
    in 2012 by Assaf Resnick and Elik Eizenberg. Resnick was an analyst at Moody’s
    before becoming a principal at Sequoia Capital and a member at Jibe Ventures.
