  excerpt: 'Parafin announces new credit facility with Goldman Sachs and One William
    Street Products Platforms Blog Careers Docs Login Contact sales Blog / Company
    June 17, 2026 Parafin announces new credit facility with Goldman Sachs and One
    William Street Team Parafin SAN FRANCISCO, CA, June 17, 2026 – Parafin, a leading
    embedded financial infrastructure company named to the 2026 Forbes Fintech 50,
    today announced a new credit facility led by Goldman Sachs, alongside One William
    Street Capital Management, L.P. Building on Parafin''s recent warehouse credit
    facility expansion with Silicon Valley Bank, EverBank, and Trinity Capital, the
    new facility will help extend access to embedded lending for more small businesses
    through the platforms they already use, including Amazon, DoorDash, Gusto, TikTok
    Shop, Walmart, and many others. The additional capacity will support financing
    products that help businesses manage cash flow, invest in growth, and navigate
    day-to-day operating needs. The growth in financing capacity reflects consistent
    demand from small businesses that return to Parafin’s products as they grow: the
    majority of Parafin’s fundings go to repeat borrowers. With over 50,000 businesses
    funded to date¹, that repeat usage underscores the role embedded capital plays
    in helping businesses invest in growth and manage cash flows. “Small businesses
    increasingly expect financial products to be built into the software and platforms
    they already use to run their businesses,” said Sahill Poddar, cofounder and CEO
    of Parafin. “Embedded lending is becoming a critical part of how businesses access
    capital, and this facility strengthens our ability to meet that demand at scale.
    Through our expanded financing capabilities, we are accelerating the delivery
    of flexible financing to small businesses from every part of the economy, supported
    by this credit facility from Goldman Sachs and One William Street." As the leader
    in embedded lending, Parafin has extended over $35 billion in offers '
