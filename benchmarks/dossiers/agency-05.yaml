    Avoq May 21, 2025 Avoq Announces Whit Askew and Cedric Grant Will Oversee Firm’s
    Government Relations Operations Washington D.C. — Avoq today announced that partners
    Whit Askew and Cedric Grant will manage the firm’s government relations (GR) operations.
    Askew and Grant will serve as co-heads of the GR team, overseeing day-to-day functions
    and business operations. “Cedric and Whit are the ideal team to oversee our government
    relations operations. Their bipartisan work across a multitude of sectors and
    industries exemplifies the strategic value we provide clients. They understand
    the issues and complexities of the Washington market and they know how to provide
    results,” said CEO Nicole Cornish. Avoq’s GR operations play a critical role in
    the firm’s overall client services, covering a wide range of issues for corporate,
    nonprofit, and trade association clients. These include healthcare, financial
    services, manufacturing, commerce, appropriations, energy, technology, travel,
    sports and entertainment. When matched with the firm’s strategic communications
    operations, Avoq’s mix of government relations services and communications capabilities
    is something few other firms in the country can offer. Askew and Grant will lead
    the GR team that features more than a dozen bipartisan government relations and
    research professionals. The team also includes fellow partners Stacey Alexander
    and Barry LaSala. Alexander, a former House chief of staff, works with multiple
    corporate and trade association clients to design strategic public affairs efforts
    that cross over multiple disciplines a'
