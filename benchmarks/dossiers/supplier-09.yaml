    service: Mechanical Oilseed Processing, Solvent Oilseed Processing, Biofuels,
    Aqua Feed, Pet Feed, Feed Mill, Polymer Processing and Manufacturing Solutions
    worldwide. Most of Anderson’s processing systems are built around the Expeller
    ® press. The Expeller press was invented in the late 1800s by the company’s founder,
    Valerius D. Anderson . All mechanical screw presses used in the industry today
    are built from the concepts originally developed in Anderson’s Expeller press
    design. Anderson has designed, manufactured, and commissioned over 12,000 pieces
    of processing equipment for over 1,000 plant installations in over 100 countries.
    Each processing solution is specifically tailored to the Customer’s unique needs
    to ensure safety, maximize productivity and drive sustainability. Anderson stands
    by our products and provides complete process support for the lifetime of our
    systems through OEM replacement parts, application support and service. Anderson
    has equipment installations from the 1920s still in operation today! Quality Quality
