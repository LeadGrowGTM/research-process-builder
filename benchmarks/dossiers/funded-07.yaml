    • 36 minute read Prashant Sridharan Product Marketing Firebase and Supabase both
    promise to give teams a full‑featured backend without managing servers. Firebase,
    owned by Google, combines a NoSQL database with authentication, file storage and
    serverless functions. Supabase is an open‑source alternative built on Postgres
    that offers similar services— auth , storage , real‑time , and functions , but
    with the predictability of SQL and the freedom to self‑host. Choosing between
    them depends on how your application models data, how you plan to scale, and your
    tolerance for vendor lock‑in. What is Supabase? # Supabase is an open‑source backend
    platform that runs on Postgres . Each project comes with a dedicated Postgres
    database, an auto‑generated REST and GraphQL API, real‑time subscriptions, and
    storage, all tied together with Row‑Level Security (RLS) . RLS policies are written
    in SQL and allow you to define granular access rules using the same language you
    use for your data. Because Supabase’s core services are built on open technologies
    like Postgres and GoTrue, you can run Supabase locally or host it yourself using
    Docker or community tools such as Kubernetes or Terraform. What is Firebase? #
    Firebase is a managed platform owned by Google. It includes Cloud Firestore (a
    document‑oriented NoSQL database), authentication, Cloud Storage for files and
    Cloud Functions for backend logic. Firestore stores data as JSON‑like documents
    grouped in collections. The SDKs automatically cache documents on the device so
    apps can read, write and listen to data while offline; changes are synchronized
    when the device reconnects . Firestore supports collection group queries , which
    let you query across collections with the same name. To handle relational dat'
