    Supabase doubles valuation to $10B in 8 months Julie Bort 9:32 AM PDT · June 5,
    2026 Supabase, the open source database of choice for the vibe-coding world, has
    raised a $500 million Series F at a $10 billion pre-money valuation, the company
    announced Friday. That’s about $10.5 billion after the investment. The newly minted
    decacorn has been doubling its valuation every few months for a couple of years
    now, as vibe-coding tools have driven its usage to astounding growth. Database
    launches on Supabase have grown over 600% in the past year, with over 60% of them
    launched “by some sort of AI tool,” CEO and co-founder Paul Copplestone wrote
    in a blog post announcing the raise . The startup also now claims nearly 10 million
    developers as users, which has doubled in eight months. Copplestone particularly
    credits Claude Code and Codex for this growth because the popular AI models “expand
    the number of people who can build.” Supabase is also a database of choice for
    Bolt, Figma, Lovable, Replit, and others. This new influx of cash follows a $100
    million round at a $5 billion valuation in October. And that raise came just months
    after closing $200 million at $2 billion. Supabase uses popular open source database
