    of Sales Search Search for: Home > About Accord The Accord Story Accord is a leading
    folding carton converter primarily serving food and beverage end markets. The
    Company is owned by Mason Wells, a Milwaukee-based firm, other board members and
    co-investors. Accord was founded in 1940 by Abraham Codo and remained a family
    operated business until May 2023. Accord designs and manufactures custom folding
    cartons for private label and branded consumer goods, primarily focused on food
    and beverage end markets. Food and beverage applications include packaging for
    dry foods, frozen foods, and can and bottle wraps and baskets for beer, seltzer,
    cocktail, energy drink, and other specialty beverage items. Accord has a unique
    position within the folding carton industry offering large format production capabilities
    coupled with industry-leading responsiveness, speed, and flexibility. Accord serves
    global and regional consumer packaged goods companies throughout North America.
