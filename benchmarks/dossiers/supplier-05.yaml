  excerpt: 'Solutions We help our customers improve productivity & quality, reduce
    downtime & waste, and increase efficiency & safety. Staying on the cutting edge
    of the latest advances in automation and control products is our mission at Advantage,
    and your advantage in enterprise automation. Increase productivity in your manufacturing
    operations with manageable activities and easily accessible plant floor data to
    respond to changing conditions, improve efficiency, and reduce costs. Historically,
    the data used in operating manufacturing equipment has been within the domain
    of the PLC and Controls Engineer, and not readily accessible to Management. Access
    to the data has required special proprietary knowledge about where and how that
    data was stored and knowledge of the methods required to import or export the
    data. Now, plant floor data is easily accessible and can be used to increase productivity
    and efficiency in your manufacturing operations. Advantage Industrial Automation
    brings the technologies of the Internet to the factory floor and into your view
    to give you: • Improved access to real-time plant information and Key Performance
    Indicators • Protection of existing investment in capital equipment • Lower life
    cycle costs of automation investments • Lower implementation costs and operating
    expense • Improved productivity and efficiency Remain safe with ergonomic and
    effective guarding systems that don’t interfere with the work process. The fast
    moving demands of automation have changed the requirements of machinery guarding.
    In the past the guarding systems that were available were more often than not
