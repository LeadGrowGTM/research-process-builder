    2026 Table of contents Share Today, we are thrilled to announce Baseten’s $1.5B
    Series F, led by Altimeter Capital, Conviction Partners, and Spark Capital, co-led
    by Sands Capital and Wellington Management, with participation from Battery Ventures,
    Blackbird, D.E. Shaw Ventures, Durable Capital Partners, Greylock, IVP, Verified
    Capital, and 01A. This is our fourth fundraise in 18 months, and we are grateful
    for our investors’ conviction and support and, most importantly, for the trust
    and partnership of our customers. Over the last year, our revenue has grown 20x,
    and inference volume has grown 40x. This growth reflects the new market reality
    — inference is the most important layer in the AI stack, and Baseten has become
    the partner of choice for companies looking for support with inference and post-training.
    We are proud to work closely with the teams defining this era, including Cursor,
    Notion, Lovable, Harvey, HubSpot, OpenEvidence, Abridge, Decagon, Parallel, and
    many more. These companies have built products where intelligence is core to the
    user experience, and their businesses are booming. They are also at the forefront
