    Round The company emerged from stealth with an AI-native platform to modernize
    legacy ERP software. Written by Built In Staff, With AI Published on Oct. 06,
    2025 Photo: Shutterstock REVIEWED BY Ashley Bowden | Oct 06, 2025 DualEntry ,
    an enterprise resource planning, or ERP, platform, has emerged from stealth and
    announced a $90 million Series A funding round. The New York-based company works
    to modernize legacy ERP software with a platform built using artificial intelligence. 
    DualEntry’s ERP accounting suite includes general ledger, accounts payable, accounts
    receivable and financial planning and analysis capabilities. It is built to handle
    accounting across multiple books, currencies and entities and is designed for
    scale. DualEntry reports that it has already processed $100 billion worth of journal
    entries using its AI and serves thousands of global users. Lightspeed Venture
    Partners and Khosla Ventures co-led the Series A , bringing DualEntry’s total
    funding secured over the past 15 months to more than $100 million. The raise will
    go toward fueling the continued growth of DualEntry’s platform. Related Resources
