    Report this company About us Anatek Labs, Inc. is a full service environmental
    analytical testing laboratory, established in 1992, with offices in Moscow, ID,
    Spokane, Wenatchee and Yakima, WA. Our mission is to provide precise and accurate
    analytical data and technical assistance to our clients in a timely and cost-effective
    manner. We test drinking water samples for community water services and private
    well customers, as well as water and environmental samples for environmental,
    industrial, and agricultural clients. Our Spokane office offers food safety testing
    and critical water testing, in addition to a wide variety of drinking water, waste
    water and soil testing. At our Spokane and Yakima locations, we provide testing
    for the Global G.A.P Program for safe farming practices. Anatek Labs in Wenatchee
    is currently a drop-off location. At Anatek Labs, we are proud of our reputation
    for analytical excellence, outstanding customer service, timely turn-around, and
    reasonable pricing. In addition to utilizing a wide range of established analytical
    methods, we have also developed many in-house methods for the analyses of unregulated
    chemical contaminants. Using powerful tools such as ICP-MS, GC/MS, HPLC and HPLC/MS/MS,
