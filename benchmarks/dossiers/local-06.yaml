  excerpt: 'Anderson Commercial Flooring | Oakland, CA Home About Us History Values
    Management Team Employee Team Services Projects Showroom Contact Us Select Page
    Learn More Renowned Quality and Service For over 65 years we’ve provided our customers
    with most innovative choices in floor coverings. Today that means a wide-variety
    of flooring options: hardwood to concrete, carpet to vinyl. As a family-run business
    for 3 generations, our decades of experience combined with a one-stop shop means
    our customers get all their flooring needs met . . . done right and always done
    on time. Polished Concrete Stunning, durable and LEED approved, our polished concrete
    process gives you a myriad of choices for lasting beauty for new concrete or retrofits.
    Restoration Need new floors? Maybe not. Our unique restoration process can often
    renew and beautify your older flooring, saving you time and money. Flooring Carpets
    that are exquisite; hardwoods and laminate that are impressive and durable; and
    functional vinyls that are still highly attractive. With hundreds of choices,
    we have the exact right flooring for you. Moisture Mitigation Quick project? Little
    time for concrete drying? Our moisture mitigation process can save the day and
    preserves your warranty with flooring manufacturers. YOUR FLOORING PARTNER | YOUR
