    Responsibility News News 2025 Year in Review Contact Home / Portfolio / Actylis
    Actylis Status Current Private Equity Flagship Control Headquarters Port Washington,
    NY Investment Date April 2019 Visit website Previous Next Actylis Founded in 1947,
    Actylis is a virtual manufacturer of niche specialty materials sold into the life
    sciences and advanced technology end markets. Actylis is particularly well-recognized
    as a leader in active pharmaceutical ingredients (API) and pharmaceutical intermediates
    as well as nutritional and agricultural protection ingredients. Actylis has over
    2,000 clients and over 1,100 virtual manufacturing relationships with a particular
    strength working with manufacturer partners in China and India. Actylis is headquartered
    in Port Washington, NY and has business operations in nine countries providing
    local support for customers and suppliers and just-in-time delivery capabilities.
    New Mountain acquired Actylis as a result of the firm’s multi-year, proactive
    “deep dive” effort in the specialty materials and life sciences sectors. New Mountain
    first approached Actylis proactively in December 2017 and completed the acquisition
    of Actylis in April 2019. New Mountain was assisted in its diligence by the former
    CEO and CFO of the parent company, both of whom worked exclusively with New Mountain
    to provide differentiated insight in the process. Back to Portfolio 1633 Broadway,
