    why when they saw the opportunity to make a difference by using renewable energy
    to power their new manufacturing plant – they took action. Who is Advanced Biotech?:
    Founded in 1993, this privately-owned New Jersey-based enterprise began by developing
    flavors and fragrance ingredients for a wide range of industries such as food
    and beverage and cosmetics. A history of innovation: A part of the company’s strategy
    from the beginning was to serve the natural flavors and fragrances space. This
    market segment represented approximately 20% of the entire flavors and fragrances
    industry at the time. Fast forward to today: With over 225 employees, the company
    today is a leader in natural flavor and fragrance ingredients, which accounts
    for more than 70% of industry in the US and Europe – and 50% globally. A smart
    move: According to a recent Grand View Research market analysis, the natural flavors
