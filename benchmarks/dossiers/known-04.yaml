    At Huhtamaki North America, we create opportunities for our customers in markets
    ranging from consumer goods and foodservice packaging to our retail business with
    customized store brand disposable tableware solutions and the Chinet® brand, one
    of the most recognized disposable tableware brands in North America. With expertise
    in paperboard, molded fiber and plastic, we are leading the food packaging industry.
    Thanks to the passion and hard work of nearly 4,000 team members in 18 manufacturing
    facilities across the U.S. and Mexico, the future has never looked brighter for
    Huhtamaki North America. Our ambition is to become the first choice in sustainable
    packaging solutions globally, and it starts right here in North America. Our global
    2030 Transformation Strategy sets the goal to achieve carbon neutral production
    and designing all our products to be recyclable, compostable, or reusable. It’s
