    — June 25, 2025 Draper-based commerce technology company Redo has raised $81 million
    in a Series B funding round at a $1.25 billion valuation, the company announced
    this week. The round was led by Smash Capital (Los Angeles) with existing investors
    Pelion Venture Partners (Draper) and Cervin Ventures (Palo Alto) participating.
    The capital will fund product development, AI initiatives, international expansion.
    It has already been partly deployed through an acquisition. Co-founder and CEO
    Sterling Snow sat down with TechBuzz to discuss the investment. He said the round
    had closed some months earlier. The team simply chose when to go public with it
    (June 23). Snow first discussed the $1.25 billion valuation number. Sterling Snow,
