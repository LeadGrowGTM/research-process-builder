    a leading global manufacturer of precision dispensing equipment. From hot melt
    adhesives and sealants to liquid adhesives, Nordson systems help manufacturers
    of consumer and industrial products operate more efficiently and improve product
    quality. Applications including packaging, nonwovens and product assembly benefit
    from Nordson systems designed for precision, reliability and repeatability. Equipment
    includes: hot melt and cold adhesive applicators; nozzles; tank and bulk melters;
    pumps; hoses; and, verification & detection systems. Genuine Nordson replacement
    parts and maintenance programs help extend the life of Nordson systems and keep
    production lines running at their best. Website http://www.nordsonadhesive.com
